<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Mona</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Custom CSS -->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    </head>
    
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">The Mona Modes</h1>
        <div class="row justify-content-center">
            <!-- Render categorieën en modes -->
            {% for category, modes in categories.items() %}
                <div class="col-12">
                    <h2 class="text-center mb-3">{{ category.replace('_', ' ').title() }}</h2>
                    <div class="row gy-4 justify-content-center">
                        {% for mode in modes.keys() %}
                            <div class="col-md-4">
                                <div class="card shadow-sm">
                                    <div class="card-body text-center">
                                        <h5 class="card-title">{{ mode }}</h5>
                                        <p class="card-text">Klik op start om {{ mode }} te starten of stop om het te stoppen.</p>
                                        <button class="btn btn-success btn-sm me-2" onclick="startMode('{{ category }}', '{{ mode }}')">Start</button>
                                        <button class="btn btn-danger btn-sm" onclick="stopMode('{{ category }}', '{{ mode }}')">Stop</button>
                                    </div>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function startMode(category, mode) {
            fetch('/start', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ category: category, mode: mode })
            })
            .then(response => response.json())
            .then(data => alert(data.message));
        }

        function stopMode(category, mode) {
            fetch('/stop', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ category: category, mode: mode })
            })
            .then(response => response.json())
            .then(data => alert(data.message));
        }
    </script>
</body>
</html>
