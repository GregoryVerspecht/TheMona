<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Welcome to The Mona!</title>
    
        <!-- Full-screen modus voor Safari -->
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
        <link rel="apple-touch-icon" href="{{ url_for('static', filename='the_mona_concept_192.png') }}">
        <script>
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register("{{ url_for('static', filename='service-worker.js') }}")
              .then(() => console.log("Service Worker Registered"))
              .catch((err) => console.log("Service Worker Failed:", err));
          }
        </script>
    </head>
<body>
    <h1>Welkom bij The Mona WiFi Hotspot!</h1>
    <p>Je bent nu verbonden met de hotspot!</p>
    <p>Liesa please collab! xoxo </p>
</body>
</html>
