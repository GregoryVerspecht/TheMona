<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mona Modes</title>
</head>
<body>
    <h1>The Mona Modes</h1>

    <!-- Toon categorieën en modes -->
    {% for category, modes in categories.items() %}
        <h2>{{ category.replace('_', ' ').title() }}</h2>
        <ul>
            {% for mode in modes.keys() %}
                <li>
                    {{ mode }}
                    <button onclick="startMode('{{ category }}', '{{ mode }}')">Start</button>
                    <button onclick="stopMode('{{ category }}', '{{ mode }}')">Stop</button>
                </li>
            {% endfor %}
        </ul>
    {% endfor %}

    <script>
        function startMode(category, mode) {
            fetch('/start', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ category: category, mode: mode })
            })
            .then(response => response.json())
            .then(data => alert(data.message));
        }

        function stopMode(category, mode) {
            fetch('/stop', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ category: category, mode: mode })
            })
            .then(response => response.json())
            .then(data => alert(data.message));
        }
    </script>
</body>
</html>
