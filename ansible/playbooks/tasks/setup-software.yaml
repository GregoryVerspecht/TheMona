- name: Update and upgrade the system
  apt:
    update_cache: yes
    upgrade: dist

- name: Install required packages
  apt:
    name:
      - hostapd
      - dnsmasq
      - python3
      - python3-pip
      - iptables
      - openssl
      - python3-venv
      - iptables-persistent
    state: present

- name: Create a virtual environment for Flask
  command: python3 -m venv /home/mona/flask_venv
  args:
    creates: /home/mona/flask_venv

- name: Upgrade pip in the virtual environment
  command: /home/mona/flask_venv/bin/pip install --upgrade pip

- name: Install Flask and dependencies in the virtual environment
  pip:
    name:
      - flask==2.1.3
      - gunicorn==20.1.0
      - RPi.GPIO==0.7.1
      - flask-cors==3.0.10
    virtualenv: /home/mona/flask_venv
